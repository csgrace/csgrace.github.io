<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuqing Wei / 魏宇晴 — Presentation</title>
<style>
  :root {
    --blue: #3B64C9; --blue-light: #9DB1E2;
    --dark: #2D3436; --gray: #636E72;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Password gate */
  #pw-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #pw-gate.hidden { display: none; }
  .pw-box {
    background: #fff; border-radius: 12px; padding: 40px 36px 32px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.15); text-align: center;
    width: 360px; max-width: 92vw;
  }
  .pw-box h2 { color: var(--blue); font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
  .pw-box .pw-sub { color: var(--gray); font-size: 0.82rem; margin-bottom: 22px; }
  .pw-box input {
    display: block; width: 240px; margin: 0 auto; padding: 11px 14px;
    border: 1.5px solid #d8dce4; border-radius: 8px; font-size: 0.95rem;
    text-align: center; outline: none; transition: border .2s;
    font-family: inherit; letter-spacing: 1px;
  }
  .pw-box input:focus {
    border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,100,201,0.08);
  }
  .pw-box .pw-btn {
    display: block; width: 240px; margin: 14px auto 0; padding: 11px;
    border-radius: 8px; background: var(--blue); color: #fff; border: none;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all .2s;
    font-family: inherit;
  }
  .pw-box .pw-btn:hover { background: #2E4FA8; }
  .pw-box .pw-err { color: #e74c3c; font-size: 0.78rem; margin-top: 10px; display: none; }

  /* Canva embed */
  #canva-container {
    position: fixed; inset: 0; display: none;
    background: #0d0d0d;
  }
  #canva-container.show { display: block; }
  #canva-container iframe {
    width: 100%; height: 100%; border: none;
    display: block;
  }

  /* Top bar */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 44px; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 16px; gap: 12px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.3s;
  }
  #top-bar:hover, #top-bar.visible { opacity: 1; }
  #top-bar a, #top-bar button {
    color: #fff; font-size: 0.8rem; text-decoration: none;
    padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
    background: transparent; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  #top-bar a:hover, #top-bar button:hover {
    background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>

<div id="pw-gate">
  <div class="pw-box">
    <h2>演示文稿</h2>
    <p class="pw-sub">请输入密码以查看内容</p>
    <input type="password" id="pw-input" placeholder="输入密码" autofocus>
    <button class="pw-btn" onclick="checkPw()">确认</button>
    <p class="pw-err" id="pw-err">密码错误，请重试</p>
  </div>
</div>

<div id="canva-container">
  <div id="top-bar">
    <a href="https://www.canva.cn/design/DAHRubK14p0/-knLy0cWCo4xbxY7Bp790A/edit" target="_blank">在 Canva 中编辑 ↗</a>
    <button onclick="toggleFullscreen()">全屏放映</button>
  </div>
  <iframe
    loading="lazy"
    src="https://www.canva.com/design/DAHRubK14p0/-knLy0cWCo4xbxY7Bp790A/view?embed"
    allowfullscreen allow="fullscreen; autoplay">
  </iframe>
</div>

<script>
  const PW_HASH = '18edd612eff7bf0e4a73f84ee88cc0c65190cf335a65bb9cf92c7c9f691ffe84';

  async function sha256(text) {
    const d = new TextEncoder().encode(text);
    const h = await crypto.subtle.digest('SHA-256', d);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function showCanva() {
    document.getElementById('pw-gate').classList.add('hidden');
    document.getElementById('canva-container').classList.add('show');
    // Auto-enter fullscreen for presentation-like experience
    setTimeout(() => {
      document.getElementById('canva-container').requestFullscreen().catch(() => {});
    }, 500);
  }

  async function checkPw() {
    const input = document.getElementById('pw-input').value;
    if (await sha256(input) === PW_HASH) {
      sessionStorage.setItem('ppt-auth', '1');
      showCanva();
    } else {
      document.getElementById('pw-err').style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPw();
  });

  if (sessionStorage.getItem('ppt-auth') === '1') {
    showCanva();
  }

  // Auto-hide top bar
  const topBar = document.getElementById('top-bar');
  let hideTimer;
  document.addEventListener('mousemove', () => {
    topBar.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => topBar.classList.remove('visible'), 2000);
  });

  function toggleFullscreen() {
    const el = document.getElementById('canva-container');
    if (!document.fullscreenElement) {
      el.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
</html>
